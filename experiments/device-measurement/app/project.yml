# xcodegen spec for the device app (`xcodegen generate` writes
# KajoDeviceBench.xcodeproj; bench-device.sh does it when xcodegen is
# installed, the generated project is committed for when it is not).
name: KajoDeviceBench
options:
  bundleIdPrefix: dev.katajamaki.kajo
  deploymentTarget:
    iOS: "18.0"
packages:
  DeviceVMs:
    path: ../swift
settings:
  base:
    DEVELOPMENT_TEAM: BDN6M642M2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  KajoDeviceBench:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kajo Bench
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.katajamaki.kajo.devicebench
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: DeviceVMs
        product: DeviceVMs
    postBuildScripts:
      - name: Bundle kernels
        basedOnDependencyAnalysis: false
        script: |
          set -e
          EXP="$SRCROOT/../.."
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/experiments"
          rm -rf "$DST"
          for e in vm-language-bench object-representation ui-thread-scheduling generational-gc concurrent-marking concurrent-relocation concurrent-young; do
            mkdir -p "$DST/$e/kernels"
            cp "$EXP/$e/kernels/"*.kasm "$DST/$e/kernels/"
          done
