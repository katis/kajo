# Generated by kajo new: the Sample app for the Mac and for iPhone and
# iPad, over one Tonel directory (src/). `xcodegen generate`
# writes Sample.xcodeproj. Both configurations link the prebuilt Release
# Kajo of the checkout the one local package names; Debug also links its
# development half and bundles a development image, Release links neither
# and bundles a release image.
name: Sample
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  Kajo:
    path: "/path/to/kajo/Prebuilt"
settings:
  base:
    DEVELOPMENT_TEAM: BDN6M642M2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_NAME: Sample
    PRODUCT_BUNDLE_IDENTIFIER: dev.katajamaki.kajo.sample
targets:
  Sample-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_MODULE_NAME: Sample
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        # The prebuilt Kajo is Apple silicon only.
        ARCHS: arm64
      configs:
        Debug:
          INFOPLIST_FILE: Info-macOS-Debug.plist
          OTHER_LDFLAGS: $(inherited) -framework KajoAppDevelopment -framework KajoDev
        Release:
          INFOPLIST_FILE: Info-macOS-Release.plist
    dependencies:
      - package: Kajo
        product: KajoApp
      - package: Kajo
        product: KajoAppDevelopment
        link: false
    postBuildScripts:
      - name: Build the image
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-images.sh"
  Sample-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_MODULE_NAME: Sample
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: Info-iOS-Debug.plist
          OTHER_LDFLAGS: $(inherited) -framework KajoAppDevelopment -framework KajoDev
        Release:
          INFOPLIST_FILE: Info-iOS-Release.plist
    dependencies:
      - package: Kajo
        product: KajoApp
      - package: Kajo
        product: KajoAppDevelopment
        link: false
    postBuildScripts:
      - name: Build the image
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-images.sh"
